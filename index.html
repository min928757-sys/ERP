<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RetailPro ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f3f5f9;--ln:#e3e8ef;--tx:#1a2233;--mu:#667085;--sd:#101a30;--sh:#1b2846;--pr:#1d5fd6;--ok:#0f9d58;--bad:#d92d20;--warn:#c77700}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;height:100vh;overflow:hidden}
button,input,select{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.hidden{display:none!important}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.view{animation:in .25s}
#login{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,#101a30,#1d3a78);z-index:100;padding:16px}
.lc{background:#fff;border-radius:12px;padding:28px;width:100%;max-width:370px}.lc h2{font-size:22px}.lc .s{color:var(--mu);margin:4px 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs .btn{flex:1;justify-content:center}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:5px}
.input{width:100%;padding:9px 11px;border:1px solid #cfd6e2;border-radius:6px;background:#fff}.input[readonly]{background:#f3f5f9}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--ln);background:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6f8fb}.btn.primary{background:var(--pr);border-color:var(--pr);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.sm{padding:4px 9px;font-size:12px}.btn.d{color:var(--bad)}
.err{color:var(--bad);font-size:12px;margin-top:10px;min-height:16px}
.app{display:flex;height:100vh}.sidebar{width:250px;background:var(--sd);color:#c3cde2;display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s}
.brand{height:60px;padding:0 18px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;color:#fff;border-bottom:1px solid #223152}
.logo{width:30px;height:30px;border-radius:8px;background:var(--pr);display:grid;place-items:center}.logo .ic{color:#fff}
.nav{flex:1;overflow-y:auto;padding:10px}.gh,.si{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;cursor:pointer;text-align:left;border-radius:6px}
.gh{padding:10px 12px;font-weight:600;font-size:13.5px;margin-top:2px}.gh span{flex:1}.gh:hover,.si:hover{background:var(--sh);color:#fff}.gh i{font-style:normal;transition:transform .25s}.grp.open .gh i{transform:rotate(90deg)}
.sub{max-height:0;overflow:hidden;transition:max-height .28s}.grp.open .sub{max-height:420px}.si{padding:8px 12px 8px 40px;font-size:13px;color:#98a6c4}.si.on{background:var(--pr);color:#fff;font-weight:600}.gh.si{padding:10px 12px;color:#c3cde2}.gh.si.on{color:#fff}
.ic{width:18px;height:18px;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:60px;background:#fff;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:12px;padding:0 20px}
.top h1{font-size:17px}.sp{flex:1}.burger{display:none}#sbn{padding:10px 20px;font-size:13px;font-weight:600}.content{flex:1;overflow-y:auto;padding:20px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px;grid-template-columns:repeat(4,1fr);margin-bottom:14px}.hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--ln);border-radius:8px;margin-bottom:14px}.grid .card{margin:0}.card-h{padding:13px 18px;border-bottom:1px solid var(--ln);font-weight:600}.card-b{padding:18px}
.kpi{padding:16px 18px}.kpi .val{font-size:21px;font-weight:700;margin-top:4px}.mu{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--ln);font-size:13px;white-space:nowrap}
th{background:#f8fafc;color:var(--mu);font-size:12px}tr:last-child td{border:0}.num{text-align:right!important}.act{text-align:right!important}.act .btn{margin-left:4px}
.empty{padding:26px;text-align:center;color:var(--mu)}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}
.badge{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}.badge.ok{background:#e6f6ee;color:var(--ok)}.badge.bad{background:#fdecea;color:var(--bad)}.badge.warn{background:#fff4dd;color:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;place-items:center;z-index:150}.modal.show{display:grid}
.mbox{background:#fff;border-radius:10px;padding:22px;width:92%;max-width:430px;max-height:92vh;overflow:auto}.mbox h3{margin-bottom:14px}.mact{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--tx);color:#fff;padding:12px 18px;border-radius:8px;z-index:200;max-width:80%}
.dbg{position:fixed;left:0;right:0;bottom:0;background:#b42318;color:#fff;padding:10px 14px;font-size:12px;z-index:999;white-space:pre-wrap}
#print{display:none}@media print{body{overflow:visible;height:auto}.app,#login,.modal,.toast,.dbg{display:none!important}#print{display:block;padding:20px;color:#000}#print table{border:1px solid #000;margin:12px 0}#print th,#print td{border:1px solid #000;padding:6px 10px}.sign{display:flex;justify-content:space-between;margin-top:60px}.sign span{border-top:1px solid #000;width:180px;text-align:center}}
body.viewer .wr{display:none!important}
@media(max-width:860px){.sidebar{position:fixed;z-index:90;height:100%;transform:translateX(-100%)}.sidebar.open{transform:none}.burger{display:inline-flex}.grid{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="login"><div class="lc"><h2>RetailPro ERP</h2><p class="s">Sign in to your shop</p>
<div class="tabs"><button class="btn primary" id="t_in">Sign in</button><button class="btn" id="t_up">Create account</button></div>
<div class="field hidden" id="snw"><label>Shop name</label><input class="input" id="sn"></div>
<div class="field"><label>Email</label><input class="input" id="em" type="email" autocomplete="username"></div>
<div class="field"><label>Password (min 6 characters)</label><input class="input" id="pw" type="password" autocomplete="current-password"></div>
<button class="btn primary" style="width:100%;justify-content:center;padding:11px" id="go">Sign in</button>
<p style="text-align:center;margin-top:12px"><a href="#" id="fp" style="color:var(--pr);font-size:13px">Forgot password?</a></p><p class="err" id="err"></p></div></div>
<div class="app hidden" id="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="logo" id="logo"></span>RetailPro</div><nav class="nav" id="nav"></nav></aside>
<div class="main"><header class="top"><button class="btn sm burger" id="burger">☰</button><h1 id="title"></h1><div class="sp"></div><span id="shop"></span><button class="btn sm" id="lo">Logout</button></header>
<div id="sbn" class="hidden"></div><main class="content" id="content"></main></div></div>
<div class="modal" id="modal"></div><div id="print"></div>
<script src="js/core.js"></script>
<script src="js/master.js"></script>
<script src="js/docs.js"></script>
<script src="js/records.js"></script>
</body></html>
