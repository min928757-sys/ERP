<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyPOS - မြန်မာ့လက်လီဆိုင်သုံး POS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #0284c7; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .product-btn { background: #e0f2fe; border: 1px solid #bae6fd; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; font-weight: bold; color: #0369a1; }
        .product-btn:active { background: #bae6fd; }
        .cart-list { margin-top: 10px; max-height: 150px; overflow-y: auto; border-top: 1px solid #e2e8f0; padding-top: 10px; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
        .total-box { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; margin-top: 15px; border-top: 2px solid #e2e8f0; padding-top: 10px; }
        .checkout-btn { width: 100%; background: #22c55e; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📦 EasyPOS (Mini)</h1>
        <span style="font-size: 14px; color: #64748b;">ဆိုင်ရှင် - ကိုယ်တိုင်</span>
    </div>

    <!-- Products Section -->
    <div class="card">
        <h3>ပစ္စည်းများ ရွေးချယ်ရန်</h3>
        <div class="product-grid" style="margin-top: 10px;">
            <div class="product-btn" onclick="addToCart('ရေသန့်', 500)">ရေသန့် (500 Ks)</div>
            <div class="product-btn" onclick="addToCart('လက်ဖက်ရည်', 1000)">လက်ဖက်ရည် (1000 Ks)</div>
            <div class="product-btn" onclick="addToCart('ခေါက်ဆွဲခြောက်', 800)">ခေါက်ဆွဲခြောက် (800 Ks)</div>
            <div class="product-btn" onclick="addToCart('ကော်ဖီမွှေး', 1200)">ကော်ဖီမွှေး (1200 Ks)</div>
        </div>
    </div>

    <!-- Cart & Checkout Section -->
    <div class="card">
        <h3>အရောင်းခြင်းတောင်း (Cart)</h3>
        <div class="cart-list" id="cartList">
            <p style="color: #94a3b8; font-size: 14px; text-align: center;">ပစ္စည်း ရွေးချယ်ထားခြင်း မရှိသေးပါ။</p>
        </div>
        <div class="total-box">
            <span>စုစုပေါင်း:</span>
            <span id="totalPrice">0 Ks</span>
        </div>
        <button class="checkout-btn" onclick="checkout()">ငွေရှင်းမည် (Checkout)</button>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({name, price});
            updateCart();
        }

        function updateCart() {
            let cartList = document.getElementById('cartList');
            let totalPriceEl = document.getElementById('totalPrice');
            
            if (cart.length === 0) {
                cartList.innerHTML = '<p style="color: #94a3b8; font-size: 14px; text-align: center;">ပစ္စည်း ရွေးချယ်ထားခြင်း မရှိသေးပါ။</p>';
                totalPriceEl.innerText = '0 Ks';
                return;
            }

            cartList.innerHTML = '';
            total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                cartList.innerHTML += `<div class="cart-item"><span>${item.name}</span><span>${item.price} Ks</span></div>`;
            });
            totalPriceEl.innerText = total.toLocaleString() + ' Ks';
        }

        function checkout() {
            if (cart.length === 0) {
                alert('ခြင်းတောင်းထဲတွင် ပစ္စည်းမရှိပါ။');
                return;
            }
            alert('အရောင်းအောင်မြင်ပါသည်! စုစုပေါင်းငွေ - ' + total.toLocaleString() + ' Ks');
            cart = [];
            updateCart();
        }
    </script>

</body>
</html>
