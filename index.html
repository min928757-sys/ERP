<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RetailPro ERP</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f3f5f9;--ln:#e3e8ef;--tx:#1a2233;--mu:#667085;--sd:#101a30;--sh:#1b2846;--pr:#1d5fd6;--ok:#0f9d58;--bad:#d92d20}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"Noto Sans Myanmar",sans-serif;background:var(--bg);color:var(--tx);font-size:14px;height:100vh;overflow:hidden}
button,input,select{font:inherit;color:inherit}.hidden{display:none!important}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.view{animation:in .25s}
#login{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,#101a30,#1d3a78);z-index:100;padding:16px}
.lc{background:#fff;border-radius:12px;padding:28px;width:100%;max-width:370px}.lc h2{font-size:22px}.lc .s{color:var(--mu);margin:4px 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs .btn{flex:1;justify-content:center}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:5px}
.input{width:100%;padding:9px 11px;border:1px solid #cfd6e2;border-radius:6px;background:#fff}.input[readonly]{background:#f3f5f9}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--ln);background:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6f8fb}.btn.primary{background:var(--pr);border-color:var(--pr);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.sm{padding:4px 9px;font-size:12px}.btn.d{color:var(--bad)}
.err{color:var(--bad);font-size:12px;margin-top:10px;min-height:16px}
.app{display:flex;height:100vh}.sidebar{width:250px;background:var(--sd);color:#c3cde2;display:flex;flex-direction:column;flex-shrink:0;transition:transform .25s}
.brand{height:60px;padding:0 18px;display:flex;align-items:center;font-weight:700;font-size:17px;color:#fff;border-bottom:1px solid #223152}
.nav{flex:1;overflow-y:auto;padding:10px}.gh,.si{display:flex;gap:10px;width:100%;border:0;background:none;color:inherit;cursor:pointer;text-align:left;border-radius:6px}
.gh{padding:10px 12px;font-weight:600}.gh:hover,.si:hover{background:var(--sh);color:#fff}.gh i{margin-left:auto;font-style:normal;transition:transform .25s}.grp.open .gh i{transform:rotate(90deg)}
.sub{max-height:0;overflow:hidden;transition:max-height .28s}.grp.open .sub{max-height:320px}.si{padding:8px 12px 8px 38px;font-size:13px;color:#98a6c4}.si.on{background:var(--pr);color:#fff;font-weight:600}.gh.si{padding:10px 12px;color:#c3cde2}
.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{height:60px;background:#fff;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:14px;padding:0 20px}
.top h1{font-size:17px}.sp{flex:1}.mu{color:var(--mu);font-size:12px}.burger{display:none}.content{flex:1;overflow-y:auto;padding:20px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}.tools{display:flex;gap:10px;flex-wrap:wrap}.tools .input{width:230px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(4,1fr);margin-bottom:14px}.card{background:#fff;border:1px solid var(--ln);border-radius:8px;margin-bottom:14px}.grid .card{margin:0}
.card-h{padding:13px 18px;border-bottom:1px solid var(--ln);font-weight:600}.card-b{padding:18px}.kpi{padding:16px 18px}.kpi .val{font-size:21px;font-weight:700;margin-top:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--ln);font-size:13px;white-space:nowrap}
th{background:#f8fafc;color:var(--mu);font-size:12px}tr:last-child td{border:0}tr.low td{background:#fff8f7}.num{text-align:right!important}.act{text-align:right!important}.act .btn{margin-left:4px}
.empty{padding:26px;text-align:center;color:var(--mu)}.hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.entry{display:grid;grid-template-columns:1.2fr 2fr .7fr .9fr auto;gap:10px;align-items:end}.entry .field{margin:0}
.tot{display:flex;justify-content:flex-end;gap:20px;padding:14px 18px;font-size:16px;font-weight:700;border-top:1px solid var(--ln)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;place-items:center;z-index:150}.modal.show{display:grid}
.mbox{background:#fff;border-radius:10px;padding:22px;width:92%;max-width:430px;max-height:92vh;overflow:auto}.mbox h3{margin-bottom:14px}.mact{display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;bottom:22px;right:22px;background:var(--tx);color:#fff;padding:12px 18px;border-radius:8px;z-index:200;max-width:80%}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}#print{display:none}
@media print{body{overflow:visible;height:auto}.app,#login,.modal,.toast{display:none!important}#print{display:block;padding:20px;color:#000}#print table{border:1px solid #000;margin:12px 0}#print th,#print td{border:1px solid #000;padding:6px 10px}.sign{display:flex;justify-content:space-between;margin-top:60px}.sign span{border-top:1px solid #000;width:180px;text-align:center}}
@media(max-width:860px){.sidebar{position:fixed;z-index:90;height:100%;transform:translateX(-100%)}.sidebar.open{transform:none}.burger{display:inline-flex}.grid{grid-template-columns:1fr 1fr}.entry{grid-template-columns:1fr 1fr}}
</style></head><body>

<div id="login"><div class="lc"><h2>RetailPro ERP</h2><p class="s">Sign in to your shop</p>
<div class="tabs"><button class="btn primary" id="t_in" onclick="mode(0)">Sign in</button><button class="btn" id="t_up" onclick="mode(1)">Create account</button></div>
<div class="field hidden" id="snw"><label>Shop name</label><input class="input" id="sn"></div>
<div class="field"><label>Email</label><input class="input" id="em" type="email"></div>
<div class="field"><label>Password (min 6 characters)</label><input class="input" id="pw" type="password"></div>
<button class="btn primary" style="width:100%;justify-content:center;padding:11px" id="go" onclick="doAuth()">Sign in</button><p class="err" id="err"></p></div></div>

<div class="app hidden" id="app"><aside class="sidebar" id="sidebar"><div class="brand">📦 RetailPro</div><nav class="nav" id="nav"></nav></aside>
<div class="main"><header class="top"><button class="btn sm burger" onclick="$('#sidebar').classList.toggle('open')">☰</button><h1 id="title"></h1><div class="sp"></div><span class="mu" id="shop"></span><button class="btn sm" onclick="logout()">Logout</button></header>
<main class="content" id="content"></main></div></div>
<div class="modal" id="modal"></div><div id="print"></div>

<script>
const sb=supabase.createClient(   location.origin+'/sb','sb_publishable_aLwnGUpyhaxJqBqmOIy6dw_3pG_Lkwg');
const $=s=>document.querySelector(s),fmt=n=>(+n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),today=()=>new Date().toISOString().slice(0,10);
let S={},cur,signup=0,shop='';
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)};
const ln=id=>S.locations.find(l=>l.id===id)?.name||'-',P=c=>S.products.find(p=>p.code===c)||{};
const dt=d=>d.lines.reduce((a,l)=>a+l.qty*l.price,0),sum=a=>a.reduce((x,d)=>x+dt(d),0),dd=t=>S.docs.filter(d=>d.doc_type===t);
const PE=[['code','Code'],['name','Name'],['phone','Phone'],['address','Address']];
const M={products:{t:'Product Master',f:[['code','Product Code'],['description','Description'],['purchase_price','Purchase Price','number'],['sale_price','Sale Price','number'],['unit','Unit'],['min_stock','Min Stock','number']]},
customers:{t:'Customers',f:PE},suppliers:{t:'Suppliers',f:PE},locations:{t:'Locations',f:[['code','Code'],['name','Location Name']]},
expenses:{t:'Expenses',f:[['expense_date','Date','date'],['description','Description'],['amount','Amount','number']]}};
const D={sale:{t:'Sale Invoice',pre:'SI',p:'customers',pl:'Customer',pr:'sale_price',s:-1},sret:{t:'Sale Return',pre:'SR',p:'customers',pl:'Customer',pr:'sale_price',s:1},
purchase:{t:'Purchase Invoice',pre:'PI',p:'suppliers',pl:'Supplier',pr:'purchase_price',s:1},pret:{t:'Purchase Return',pre:'PR',p:'suppliers',pl:'Supplier',pr:'purchase_price',s:-1},transfer:{t:'Stock Transfer',pre:'ST'}};
const NAV=[['Dashboard','📊',[['dash','Dashboard']]],['Sales','🧾',[['sale','New Sale Invoice'],['sale-r','Sale Records'],['sret','Sale Return'],['sret-r','Return Records'],['customers','Customers']]],
['Purchase','📥',[['purchase','New Purchase Invoice'],['purchase-r','Purchase Records'],['pret','Purchase Return'],['pret-r','Return Records'],['suppliers','Suppliers']]],
['Inventory','🏷️',[['products','Product Master'],['stock','Stock Balance'],['transfer','New Stock Transfer'],['transfer-r','Transfer Records'],['locations','Locations']]],['Accounts','💰',[['expenses','Expenses']]]];

/* ---------- auth ---------- */
function mode(m){signup=m;$('#snw').classList.toggle('hidden',!m);$('#go').textContent=m?'Create account':'Sign in';$('#t_in').className='btn'+(m?'':' primary');$('#t_up').className='btn'+(m?' primary':'')}
const err=m=>$('#err').textContent=m;
async function doAuth(){err('');const e=$('#em').value.trim(),p=$('#pw').value;if(!e||p.length<6)return err('Enter email and a password of 6+ characters');
 if(signup){const sn=$('#sn').value.trim();if(!sn)return err('Enter your shop name');
  const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{shop:sn}}});if(error)return err(error.message);
  if(!data.session)return err('Account created. Please confirm via the email we sent, then sign in.')}
 else{const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)return err(error.message)}
 start()}
async function start(){const {data:{session}}=await sb.auth.getSession();if(!session)return;
 const {data:pr}=await sb.from('profiles').select('tenant_id').maybeSingle();
 if(!pr){const {error}=await sb.rpc('create_shop',{shop_name:session.user.user_metadata.shop||'My Shop'});if(error)return err(error.message)}
 const {data:t}=await sb.from('tenants').select('name').maybeSingle();shop=t?.name||'';$('#shop').textContent=shop;
 if(!await load())return;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');buildNav();go('dash')}
async function logout(){await sb.auth.signOut();location.reload()}
$('#pw').addEventListener('keydown',e=>e.key==='Enter'&&doAuth());

/* ---------- data ---------- */
async function load(){const r=await Promise.all([...['locations','products','customers','suppliers','expenses'].map(t=>sb.from(t).select('*')),sb.from('documents').select('*,document_lines(*)')]);
 const bad=r.find(x=>x.error);if(bad){err(bad.error.message);toast(bad.error.message);return false}
 [S.locations,S.products,S.customers,S.suppliers,S.expenses]=r.slice(0,5).map(x=>x.data);
 S.docs=r[5].data.map(d=>({...d,lines:d.document_lines.map(l=>({code:l.product_code,desc:l.description,qty:+l.qty,price:+l.price}))}));return true}
function stock(){const s={},a=(c,l,q)=>{(s[c]=s[c]||{})[l]=(s[c][l]||0)+q};
 S.docs.forEach(d=>d.lines.forEach(l=>{if(d.doc_type==='transfer'){a(l.code,d.location_id,-l.qty);a(l.code,d.to_location_id,l.qty)}else a(l.code,d.location_id,D[d.doc_type].s*l.qty)}));return s}
const tq=c=>Object.values(stock()[c]||{}).reduce((a,b)=>a+b,0);
function neg(){const s=stock();for(const c in s)for(const l in s[c])if(s[c][l]<0)return c+' at '+ln(l)}
const nextNo=t=>D[t].pre+String(dd(t).reduce((m,d)=>Math.max(m,parseInt(d.doc_no.slice(2))||0),0)+1).padStart(4,'0');

/* ---------- nav ---------- */
function buildNav(){$('#nav').innerHTML=NAV.map(([g,ic,it])=>it.length<2?`<button class="gh si" data-id="${it[0][0]}" onclick="go('${it[0][0]}')">${ic} ${g}</button>`:
 `<div class="grp"><button class="gh" onclick="this.parentNode.classList.toggle('open')">${ic} ${g}<i>›</i></button><div class="sub">${it.map(([id,t])=>`<button class="si" data-id="${id}" onclick="go('${id}')">${t}</button>`).join('')}</div></div>`).join('')}
function go(id,arg){document.querySelectorAll('.si').forEach(b=>{const on=b.dataset.id===id;b.classList.toggle('on',on);if(on)b.closest('.grp')?.classList.add('open')});
 $('#sidebar').classList.remove('open');const base=id.replace(/-r$/,'');
 const [t,h,fn]=M[id]?master(id):D[base]&&id!==base?rec(base):D[id]?doc(id,arg):V[id]();
 $('#title').textContent=t;const c=$('#content');c.innerHTML=`<div class="view">${h}</div>`;c.scrollTop=0;fn&&fn()}

/* ---------- master data ---------- */
function master(id){const c=M[id],body=()=>{const q=($('#q')?.value||'').toLowerCase();
 return S[id].filter(r=>JSON.stringify(r).toLowerCase().includes(q)).map(r=>`<tr>${c.f.map(([k,,ty])=>`<td class="${ty==='number'?'num':''}">${ty==='number'?fmt(r[k]):esc(r[k])}</td>`).join('')}${id==='products'?`<td class="num">${fmt(tq(r.code))}</td>`:''}<td class="act"><button class="btn sm" onclick="mform('${id}','${r.id}')">Edit</button><button class="btn sm d" onclick="mdel('${id}','${r.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No records yet. Click "Add New".</td></tr>'};
 return[c.t,`<div class="page-head"><div class="tools"><input class="input" id="q" placeholder="Search..." oninput="$('#tb').innerHTML=window.mb()"><button class="btn primary" onclick="mform('${id}')">+ Add New</button></div></div>
 <div class="card"><div class="tw"><table><thead><tr>${c.f.map(([,l,ty])=>`<th class="${ty==='number'?'num':''}">${l}</th>`).join('')}${id==='products'?'<th class="num">In Stock</th>':''}<th></th></tr></thead><tbody id="tb">${body()}</tbody></table></div></div>`,()=>window.mb=body]}
function mform(id,rid){const c=M[id],r=rid?S[id].find(x=>x.id===rid):{};
 $('#modal').innerHTML=`<div class="mbox"><h3>${rid?'Edit':'Add'} – ${c.t}</h3>${c.f.map(([k,l,ty])=>`<div class="field"><label>${l}</label><input class="input" id="f_${k}" type="${ty||'text'}" ${rid&&id==='products'&&k==='code'?'readonly':''} value="${esc(r[k]??(ty==='date'?today():''))}"></div>`).join('')}<div class="mact"><button class="btn" onclick="mclose()">Cancel</button><button class="btn primary" onclick="msave('${id}','${rid||''}')">Save</button></div></div>`;
 $('#modal').classList.add('show')}
const mclose=()=>$('#modal').classList.remove('show');
async function msave(id,rid){const c=M[id],o={};c.f.forEach(([k,,ty])=>o[k]=ty==='number'?+$('#f_'+k).value||0:$('#f_'+k).value.trim());
 if(!o[c.f[0][0]]||!o[c.f[1][0]])return toast('Please fill '+c.f[0][1]+' and '+c.f[1][1]);
 if(c.f[0][0]==='code'&&S[id].some(x=>x.code===o.code&&x.id!==rid))return toast('This code already exists');
 const {error}=rid?await sb.from(id).update(o).eq('id',rid):await sb.from(id).insert(o);if(error)return toast(error.message);
 await load();mclose();toast('Saved');go(id)}
async function mdel(id,rid){const r=S[id].find(x=>x.id===rid);
 const used=id==='products'?S.docs.some(d=>d.lines.some(l=>l.code===r.code)):id==='locations'?S.docs.some(d=>d.location_id===rid||d.to_location_id===rid):false;
 if(used)return toast('Cannot delete: already used in transactions');if(!confirm('Delete this record?'))return;
 const {error}=await sb.from(id).delete().eq('id',rid);if(error)return toast(error.message);await load();go(id)}

/* ---------- documents ---------- */
function doc(type,eid){const c=D[type],isT=type==='transfer',e=eid&&S.docs.find(d=>d.id===eid);
 cur=e?JSON.parse(JSON.stringify(e)):{doc_type:type,doc_date:today(),partner:isT?'':(S[c.p][0]?.name||''),location_id:S.locations[0]?.id,to_location_id:(S.locations[1]||S.locations[0])?.id,note:'',lines:[]};
 const lo=v=>S.locations.map(l=>`<option value="${l.id}" ${l.id===v?'selected':''}>${esc(l.name)}</option>`).join('');
 return[(e?'Edit ':'New ')+c.t,`<div class="page-head"><div></div><div class="tools"><button class="btn" onclick="go('${type}')">New</button><button class="btn" onclick="cur.lines.length?printDoc(cur):toast('Add an item first')">🖨 Print</button><button class="btn ok" onclick="saveDoc()">💾 Save</button></div></div>
 <div class="card"><div class="card-b hg"><div class="field"><label>Document No.</label><input class="input" value="${cur.doc_no||nextNo(type)}" readonly></div>
 <div class="field"><label>Date</label><input class="input" type="date" value="${cur.doc_date}" onchange="cur.doc_date=this.value"></div>
 ${isT?`<div class="field"><label>From Location</label><select class="input" onchange="cur.location_id=this.value;pick()">${lo(cur.location_id)}</select></div><div class="field"><label>To Location</label><select class="input" onchange="cur.to_location_id=this.value">${lo(cur.to_location_id)}</select></div>`:
 `<div class="field"><label>${c.pl}</label><select class="input" onchange="cur.partner=this.value">${S[c.p].map(p=>`<option ${p.name===cur.partner?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Location</label><select class="input" onchange="cur.location_id=this.value;pick()">${lo(cur.location_id)}</select></div>`}
 <div class="field"><label>Note</label><input class="input" value="${esc(cur.note)}" oninput="cur.note=this.value"></div></div></div>
 <div class="card"><div class="card-b entry"><datalist id="pl">${S.products.map(p=>`<option value="${esc(p.code)}">${esc(p.description)}</option>`).join('')}</datalist>
 <div class="field"><label>Product Code</label><input class="input" id="e_code" list="pl" oninput="pick()"></div>
 <div class="field"><label>Description <small id="e_av" style="color:var(--ok)"></small></label><input class="input" id="e_desc" readonly></div>
 <div class="field"><label>Qty</label><input class="input" id="e_qty" type="number" min="1" value="1"></div>
 ${isT?'<div></div>':'<div class="field"><label>Price</label><input class="input" id="e_price" type="number"></div>'}<button class="btn primary" onclick="addLine()">+ Add</button></div></div>
 <div class="card"><div class="tw" id="lines"></div><div class="tot" ${isT?'hidden':''}><span>Total</span><span id="tot">0</span> Ks</div></div>`,drawLines]}
function pick(){const p=P($('#e_code').value.trim());$('#e_desc').value=p.description||'';const pr=$('#e_price');if(pr&&p.code)pr.value=p[D[cur.doc_type].pr];
 $('#e_av').textContent=p.code?'(stock here: '+((stock()[p.code]||{})[cur.location_id]||0)+')':''}
function addLine(){const code=$('#e_code').value.trim(),p=P(code),q=+$('#e_qty').value;if(!p.code)return toast('Select a valid product code');if(!(q>0))return toast('Enter a quantity');
 const price=cur.doc_type==='transfer'?0:+$('#e_price').value||0,ex=cur.lines.find(l=>l.code===code);
 ex?(ex.qty+=q,ex.price=price):cur.lines.push({code,desc:p.description,qty:q,price});$('#e_code').value='';$('#e_qty').value=1;pick();drawLines();$('#e_code').focus()}
function drawLines(){const isT=cur.doc_type==='transfer';
 $('#lines').innerHTML=`<table><thead><tr><th>#</th><th>Code</th><th>Description</th><th class="num">Qty</th>${isT?'':'<th class="num">Price</th><th class="num">Amount</th>'}<th></th></tr></thead><tbody>${cur.lines.map((l,i)=>`<tr><td>${i+1}</td><td>${esc(l.code)}</td><td>${esc(l.desc)}</td><td class="num">${fmt(l.qty)}</td>${isT?'':`<td class="num">${fmt(l.price)}</td><td class="num">${fmt(l.qty*l.price)}</td>`}<td class="act"><button class="btn sm" onclick="editLine(${i})">Edit</button><button class="btn sm d" onclick="cur.lines.splice(${i},1);drawLines()">Delete</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No items yet.</td></tr>'}</tbody></table>`;
 if($('#tot'))$('#tot').textContent=fmt(dt(cur))}
function editLine(i){const l=cur.lines.splice(i,1)[0];$('#e_code').value=l.code;pick();$('#e_qty').value=l.qty;if($('#e_price'))$('#e_price').value=l.price;drawLines()}
async function saveDoc(){const type=cur.doc_type,isT=type==='transfer';
 if(!cur.lines.length)return toast('Add at least one item');if(isT&&cur.location_id===cur.to_location_id)return toast('From and To must be different');
 const keep=S.docs;S.docs=[...keep.filter(d=>d.id!==cur.id),cur];const bad=neg();S.docs=keep;if(bad)return toast('Not enough stock: '+bad);
 const row={doc_type:type,doc_date:cur.doc_date,partner:isT?null:cur.partner,location_id:cur.location_id,to_location_id:isT?cur.to_location_id:null,note:cur.note};
 let id=cur.id,r;
 if(id){r=await sb.from('documents').update(row).eq('id',id);if(r.error)return toast(r.error.message);await sb.from('document_lines').delete().eq('document_id',id)}
 else{row.doc_no=nextNo(type);r=await sb.from('documents').insert(row).select().single();if(r.error)return toast(r.error.message);id=r.data.id;cur.doc_no=row.doc_no}
 r=await sb.from('document_lines').insert(cur.lines.map(l=>({document_id:id,product_code:l.code,description:l.desc,qty:l.qty,price:l.price})));if(r.error)return toast(r.error.message);
 await load();toast('Saved '+cur.doc_no);if(confirm('Saved. Print now?'))printDoc(cur);go(type+'-r')}
function printDoc(d){const c=D[d.doc_type],isT=d.doc_type==='transfer';

let RB=null;
async function rsCheck(){
 const f=$('#rf').files[0];if(!f)return toast('Choose a backup file first');
 let b;try{b=JSON.parse(await f.text())}catch(e){return toast('This file is not a valid backup')}
 if(!Array.isArray(b.documents)||!Array.isArray(b.products)||!Array.isArray(b.locations))return toast('This is not a RetailPro backup file');
 const by=(a,k)=>r=>!(a||[]).some(x=>x[k]===r[k]);
 const loc=b.locations.filter(by(S.locations,'code')),prod=b.products.filter(by(S.products,'code')),
  cust=(b.customers||[]).filter(by(S.customers,'code')),supp=(b.suppliers||[]).filter(by(S.suppliers,'code')),
  exp=(b.expenses||[]).filter(r=>!S.expenses.some(x=>x.expense_date===r.expense_date&&x.description===r.description&&+x.amount===+r.amount)),
  docs=b.documents.filter(d=>!S.docs.some(x=>x.doc_type===d.doc_type&&x.doc_no===d.doc_no));
 const n=loc.length+prod.length+cust.length+supp.length+exp.length+docs.length;RB={b,loc,prod,cust,supp,exp,docs,n};
 $('#rs_out').innerHTML=`<div style="margin-top:14px"><p>Backup of <b>${esc(b.shop)}</b>, ${esc((b.exported_at||'').slice(0,10))}. Current shop: <b>${esc(shop)}</b>.</p>
 ${b.shop!==shop?'<p style="color:var(--bad);margin-top:6px">The shop names are different. Make sure this is the right shop.</p>':''}
 <div class="tw"><table><tbody>${[['Locations',loc],['Products',prod],['Customers',cust],['Suppliers',supp],['Expenses',exp],['Invoices and other documents',docs]].map(([k,a])=>`<tr><td>${k}</td><td class="num">${a.length} missing</td></tr>`).join('')}</tbody></table></div>
 ${n?`<button class="btn ok" style="margin-top:12px" id="rs_go" onclick="rsRun()">Restore ${n} missing records</button>`:'<p class="mu" style="margin-top:10px">Nothing to restore. Everything in this file already exists in this shop.</p>'}</div>`}
async function rsRun(){
 if(!RB)return;const {b,loc,prod,cust,supp,exp,docs,n}=RB;
 if(b.shop!==shop&&!confirm('This backup is from "'+b.shop+'" but you are in "'+shop+'". Continue?'))return;
 if(!confirm('Add '+n+' missing records to "'+shop+'"? Existing records will not be changed.'))return;
 const btn=$('#rs_go');btn.disabled=true;btn.textContent='Restoring...';
 const ins=async(t,rows,sel)=>{let out=[];for(let i=0;i<rows.length;i+=300){const q=sb.from(t).insert(rows.slice(i,i+300));const r=sel?await q.select(sel):await q;if(r.error)throw new Error(t+': '+r.error.message);if(r.data)out=out.concat(r.data)}return out};
 let made=[],skipped=0;
 try{
  await ins('locations',loc.map(r=>({tenant_id:T,code:r.code,name:r.name})));
  await ins('products',prod.map(r=>({tenant_id:T,code:r.code,description:r.description,purchase_price:r.purchase_price,sale_price:r.sale_price,unit:r.unit,min_stock:r.min_stock})));
  await ins('customers',cust.map(r=>({tenant_id:T,code:r.code,name:r.name,phone:r.phone,address:r.address})));
  await ins('suppliers',supp.map(r=>({tenant_id:T,code:r.code,name:r.name,phone:r.phone,address:r.address})));
  await ins('expenses',exp.map(r=>({tenant_id:T,expense_date:r.expense_date,description:r.description,amount:r.amount})));
  const lr=await sb.from('locations').select('id,code').eq('tenant_id',T);if(lr.error)throw new Error(lr.error.message);
  const byCode=Object.fromEntries(lr.data.map(l=>[l.code,l.id])),map={};b.locations.forEach(l=>map[l.id]=byCode[l.code]);
  const ok=docs.filter(d=>map[d.location_id]&&(!d.to_location_id||map[d.to_location_id]));skipped=docs.length-ok.length;
  made=await ins('documents',ok.map(d=>({tenant_id:T,doc_type:d.doc_type,doc_no:d.doc_no,doc_date:d.doc_date,partner:d.partner,location_id:map[d.location_id],to_location_id:d.to_location_id?map[d.to_location_id]:null,note:d.note})),'id,doc_type,doc_no');
  const idOf={};made.forEach(m=>idOf[m.doc_type+'|'+m.doc_no]=m.id);const lines=[],pays=[];
  ok.forEach(d=>{const id=idOf[d.doc_type+'|'+d.doc_no];if(!id)return;const ls=d.lines||[];
   ls.forEach(l=>lines.push({tenant_id:T,document_id:id,product_code:l.code,description:l.desc,qty:l.qty,price:l.price,cost:l.cost||0}));
   if(Array.isArray(d.payments))d.payments.forEach(p=>pays.push({tenant_id:T,document_id:id,pay_date:p.pay_date||today(),amount:p.amount,note:p.note}));
   else if(d.doc_type==='sale'||d.doc_type==='purchase'){const t=ls.reduce((a,l)=>a+l.qty*l.price,0);if(t>0)pays.push({tenant_id:T,document_id:id,amount:t,note:'Restored (paid)'})}});
  await ins('document_lines',lines);await ins('payments',pays);
 }catch(e){
  if(made.length)await sb.from('documents').delete().in('id',made.map(m=>m.id));
  btn.disabled=false;btn.textContent='Restore '+n+' missing records';return toast('Restore stopped: '+e.message)}
 RB=null;await load();$('#rs_out').innerHTML=`<p style="margin-top:14px"><b>Done.</b> ${n-skipped} records restored.${skipped?' '+skipped+' documents were skipped because their location is not in the file.':''}</p>`;toast('Restore finished')}

  else if(d.doc_type===ret)L.push({date:d.doc_date,o:2,txt:d.doc_no+' (return)',dr:0,cr:dt(d)})});
 Object.values(G).forEach(g=>{PGR.push(g);L.push({date:g.date,o:3,txt:'Payment'+(g.method?' ('+g.method+')':'')+(g.note?' - '+g.note:'')+(g.cred?' [return credit applied: '+fmt(g.cred)+']':''),dr:0,cr:g.cash,gi:PGR.length-1})});

function rcvOpen(type,name){
 const x=ptnr(type,name);if(x.tot<=0.005)return toast('Nothing outstanding');
 RC={type,name};const isS=type==='sale';
 $('#modal').innerHTML=`<div class="mbox"><h3>${isS?'Receive payment':'Make payment'}: ${esc(name||'-')}</h3>
 <div class="row"><span>Unpaid invoices</span><b>${fmt(x.tot)} Ks</b></div>
 ${x.credit?`<div class="row"><span>Return credit available</span><b>${fmt(x.credit)} Ks</b></div>`:''}
 <div class="field" style="margin-top:12px"><label>Date</label><input class="input" id="rc_d" type="date" value="${today()}"></div>
 <div class="field"><label>Amount ${isS?'received':'paid'}</label><input class="input" id="rc_a" type="number" min="0" value="${Math.max(0,r2(x.tot-x.credit))}" oninput="rcvPrev()"></div>
 <div class="field"><label>Method</label><select class="input" id="rc_m">${PM.map(m=>`<option>${m}</option>`).join('')}</select></div>
 <div class="field"><label>Note</label><input class="input" id="rc_n"></div>
 ${x.credit?'<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" id="rc_c" checked onchange="rcvPrev()"> Use return credit first</label>':''}
 <div id="rc_p" class="mu" style="margin:10px 0"></div>
 <div class="mact"><button class="btn" onclick="mclose()">Cancel</button><button class="btn ok" onclick="rcvSave()">Save</button></div></div>`;
 $('#modal').classList.add('show');rcvPrev()}
function rcvPlan(){
 const x=ptnr(RC.type,RC.name),cash=r2($('#rc_a').value),useC=$('#rc_c')&&$('#rc_c').checked;
 if(cash<0)return{error:'Enter an amount'};
 if(cash>x.tot+0.005)return{error:'More than the unpaid amount ('+fmt(x.tot)+' Ks)'};
 const credit=useC?Math.min(x.credit,r2(x.tot-cash)):0;
 if(cash+credit<=0)return{error:'Enter an amount'};
 let m=cash,c=credit;const rows=[];
 for(const o of x.open){let need=o.bal;
  const fc=Math.min(c,need);if(fc>0.004){rows.push({d:o.d,amount:r2(fc),credit:true});c=r2(c-fc);need=r2(need-fc)}
  const fm=Math.min(m,need);if(fm>0.004){rows.push({d:o.d,amount:r2(fm),credit:false});m=r2(m-fm)}
  if(c<=0.004&&m<=0.004)break}
 return{rows,cash,credit,x}}
function rcvPrev(){const p=rcvPlan(),el=$('#rc_p');if(!el)return;
 if(p.error){el.textContent=p.error;return}
 const left=r2(p.x.tot-p.cash-p.credit);
 el.innerHTML='Applied to the oldest invoices first:<br>'+p.rows.map(r=>esc(r.d.doc_no)+': '+fmt(r.amount)+(r.credit?' (return credit)':'')).join('<br>')+(left>0.005?'<br><b>Still unpaid after this: '+fmt(left)+' Ks</b>':'<br><b>Fully settled</b>')}

 const {error}=await sb.from('payments').insert(rows);if(error)return toast(error.message);

function plCalc(f,t,loc){

  by=k=>docs.filter(d=>d.doc_type===k),
  val=a=>a.reduce((x,d)=>x+d.lines.reduce((y,l)=>y+l.qty*cst(l),0),0);
 const sales=sum(by('sale')),sret=sum(by('sret')),net=sales-sret,cogs=val(by('sale'))-val(by('sret')),
  outs=by('sout'),own=val(outs.filter(d=>d.reason==='Own use')),loss=val(outs.filter(d=>d.reason!=='Own use')),
  gain=val(by('sin').filter(d=>GAIN.includes(d.reason))),cats={};
 ex.forEach(e=>{const k=e.category||'Other';cats[k]=(cats[k]||0)+ +e.amount});
 const exp=Object.values(cats).reduce((a,b)=>a+b,0),gp=net-cogs;

function plTop(f,t){

function trendSvg(ms){

  vals=ms.flatMap(m=>[m.net,m.profit,0]),mx=Math.max(...vals),mn=Math.min(...vals),rng=(mx-mn)||1,

  k=v=>{const a=Math.abs(v);return(v<0?'-':'')+(a>=1e6?(a/1e6).toFixed(a>=1e7?0:1)+'M':a>=1e3?Math.round(a/1e3)+'k':Math.round(a))};
 let g='';
 for(let i=0;i<=4;i++){const v=mn+rng*i/4,yy=y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#e3e8ef"/><text x="${pl-6}" y="${yy+4}" text-anchor="end" font-size="11" fill="#667085">${k(v)}</text>`}

  lab=ms.map((m,i)=>`<text x="${pl+i*bw+bw/2}" y="${H-pb+16}" text-anchor="middle" font-size="11" fill="#667085">${m.lab}</text>`+(m.yr?`<text x="${pl+i*bw+bw/2}" y="${H-pb+30}" text-anchor="middle" font-size="10" fill="#98a2b3">${m.yr}</text>`:'')).join('');
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Net sales and net profit by month">${g}<line x1="${pl}" x2="${W-pr}" y1="${y0}" y2="${y0}" stroke="#98a2b3"/>${bars}${line}${lab}</svg>`}

 plCats(c).forEach(([k,v])=>rows.push([k,-v,'ind']));
 rows.push(['Total expenses',-c.exp,'sub'],['Stock loss (damaged, expired, lost, count correction)',-c.loss],
  ['Stock gains (found / returned, count correction)',c.gain],['Own use (goods taken by owner)',-c.own],['Net profit',c.profit,'total']);
 return rows}
function plStmtHtml(rows){
 return`<table><tbody>${rows.map(([l,v,k])=>{
  const st=k==='sub'?'font-weight:700;background:#f8fafc':k==='total'?'font-weight:700;font-size:15px;background:#eef4ff':k==='head'?'font-weight:600;color:#667085':'';
  return`<tr style="${st}"><td style="white-space:normal;${k==='ind'?'padding-left:34px':''}">${esc(l)}</td><td class="num" style="${k==='total'?'color:'+(v>=0?'#0f9d58':'#d92d20'):''}">${v===''?'':fmt(v)}</td></tr>`}).join('')}</tbody></table>`}
const plTopHtml=t=>`<table><thead><tr><th>Code</th><th>Description</th><th class="num">Qty</th><th class="num">Sales</th><th class="num">Profit</th></tr></thead><tbody>${t.map(o=>`<tr><td>${esc(o.code)}</td><td style="white-space:normal">${esc(o.desc)}</td><td class="num">${fmt(o.qty)}</td><td class="num">${fmt(o.rev)}</td><td class="num">${fmt(o.profit)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No sales in this period.</td></tr>'}</tbody></table>`;
const plLocHtml=d=>`<table><thead><tr><th>Location</th><th class="num">Net sales</th><th class="num">Gross profit</th><th class="num">Margin</th><th class="num">Expenses</th><th class="num">Stock loss + own use</th><th class="num">Net profit</th></tr></thead><tbody>${d.locs.map(l=>`<tr><td>${esc(l.name)}</td><td class="num">${fmt(l.net)}</td><td class="num">${fmt(l.gp)}</td><td class="num">${l.net?(l.gp/l.net*100).toFixed(1)+'%':'-'}</td><td class="num">${fmt(l.exp)}</td><td class="num">${fmt(l.loss+l.own-l.gain)}</td><td class="num"><b>${fmt(l.profit)}</b></td></tr>`).join('')}
 <tr><td>General expenses (not assigned to a shop)</td><td></td><td></td><td></td><td class="num">${fmt(d.gen)}</td><td></td><td class="num"><b>${fmt(-d.gen)}</b></td></tr>
 <tr style="font-weight:700;background:#eef4ff"><td>Business total</td><td class="num">${fmt(d.cur.net)}</td><td class="num">${fmt(d.cur.gp)}</td><td class="num">${d.cur.net?(d.cur.gp/d.cur.net*100).toFixed(1)+'%':'-'}</td><td class="num">${fmt(d.cur.exp)}</td><td class="num">${fmt(d.cur.loss+d.cur.own-d.cur.gain)}</td><td class="num">${fmt(d.cur.profit)}</td></tr></tbody></table>`;
const PL_NOTE='Accrual basis: sales and purchases count on the invoice date, even if the customer has not paid yet. Cost of goods sold is the purchase cost of the goods you actually sold (not your purchases). Opening stock and Stock In "Other" are not counted.';

V.pl=()=>{
 const d=plData(),c=d.cur,p=d.prev,mg=c.net?(c.gp/c.net*100).toFixed(1):'0.0',
  kpi=(l,v,dd,col)=>`<div class="card kpi"><div class="mu">${l}</div><div class="val" style="${col?'color:'+col:''}">${fmt(v)} Ks</div><div>${dd}</div></div>`,
  cats=plCats(c),mxc=Math.max(1,...cats.map(x=>x[1])),
  btn=(k,t)=>`<button class="btn sm" onclick="plPreset('${k}')">${t}</button>`;
 return['Profit & Loss',`<div class="page-head"><div class="tools" style="align-items:center">${btn('m','This month')}${btn('lm','Last month')}${btn('y','This year')}${btn('12','Last 12 months')}
  <input class="input" style="width:auto" type="date" value="${d.f}" onchange="PLS.f=this.value;go('pl')"><input class="input" style="width:auto" type="date" value="${d.t}" onchange="PLS.t=this.value;go('pl')"></div>
  <button class="btn primary" onclick="plPrint()">Download PDF</button></div>
 <p class="mu" style="margin:-4px 0 14px">${esc(d.locName)} &middot; ${d.f} to ${d.t}</p>
 <div class="grid">${kpi('Net sales',c.net,dlt(c.net,p.net))}${kpi('Gross profit',c.gp,'<span class="mu" style="font-size:12px">Margin '+mg+'%</span> '+dlt(c.gp,p.gp))}${kpi('Expenses',c.exp+c.loss+c.own-c.gain,'<span class="mu" style="font-size:12px">Operating expenses + stock loss + own use</span>')}${kpi('Net profit',c.profit,dlt(c.profit,p.profit),c.profit>=0?'#0f9d58':'#d92d20')}</div>
 <div class="card"><div class="card-h"><span>Net sales and net profit, 12 months to ${MN[+d.t.slice(5,7)-1]} ${d.t.slice(0,4)}</span><span class="mu" style="font-size:12px"><span style="display:inline-block;width:10px;height:10px;background:#c7d8fa;border-radius:2px"></span> Net sales &nbsp; <span style="display:inline-block;width:10px;height:3px;background:#0f9d58;vertical-align:middle"></span> Net profit</span></div><div class="card-b">${trendSvg(d.ms)}</div></div>
 <div class="grid two"><div class="card"><div class="card-h">Profit and loss statement</div><div class="tw">${plStmtHtml(plStmt(c))}</div></div>
 <div class="card"><div class="card-h">Expenses by category</div><div class="card-b">${cats.map(([k,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(k)}</span><b>${fmt(v)} <span class="mu" style="font-weight:400">(${c.exp?(v/c.exp*100).toFixed(0):0}%)</span></b></div><div style="height:6px;background:#e8f0fe;border-radius:4px"><div style="height:6px;width:${v/mxc*100}%;background:var(--pr);border-radius:4px"></div></div></div>`).join('')||'<div class="empty">No expenses in this period.</div>'}</div></div></div>
 <div class="card"><div class="card-h">Top products by profit</div><div class="tw">${plTopHtml(d.tops)}</div></div>
 ${d.locs?`<div class="card"><div class="card-h">Locations compared</div><div class="tw">${plLocHtml(d)}</div></div>`:''}
 <p class="mu" style="font-size:12px;margin-bottom:6px">${esc(PL_NOTE)}</p>
 <p class="mu" style="font-size:12px">Download PDF opens the print window. Choose Save as PDF (on a phone, usually under Share).</p>`]};

function plPrint(){
 const d=plData(),c=d.cur;
 $('#print').innerHTML=`<h2>${esc(shop)}</h2><h3>Profit and Loss Statement</h3><p>${d.f} to ${d.t} &nbsp; | &nbsp; ${esc(d.locName)} &nbsp; | &nbsp; Printed ${today()}</p>
 ${trendSvg(d.ms)}<h4>Statement</h4>${plStmtHtml(plStmt(c))}
 <h4>Top products by profit</h4>${plTopHtml(d.tops)}${d.locs?'<h4>Locations compared</h4>'+plLocHtml(d):''}
 <p style="font-size:11px;margin-top:10px">${esc(PL_NOTE)}</p>`;
 window.print()}

/* Excel: monthly profit and loss with the same figures */
if(typeof SH!=='undefined')SH['Profit and Loss']=()=>{
 const xf=typeof X!=='undefined'?X.f:'',xt=typeof X!=='undefined'?X.t:'',
  all=[...S.docs.map(d=>d.doc_date),...S.expenses.map(e=>e.expense_date)].filter(Boolean).sort(),
  f=xf||all[0]||today(),t=xt||today(),
  [y1,m1]=f.slice(0,7).split('-').map(Number),[y2,m2]=t.slice(0,7).split('-').map(Number),rows=[];
 let y=y1,m=m1;
 for(let n=0;n<60&&(y<y2||(y===y2&&m<=m2));n++){
  const a=mStart(y,m)<f?f:mStart(y,m),b=mEnd(y,m)>t?t:mEnd(y,m),c=plCalc(a,b);
  rows.push([y+'-'+String(m).padStart(2,'0'),c.net,c.cogs,c.gp,c.exp,c.loss,c.own,c.gain,c.profit]);
  m++;if(m>12){m=1;y++}}
 const tot=[...Array(8)].map((_,i)=>rows.reduce((s,r)=>s+r[i+1],0));
 return[['Month','Net sales','Cost of goods sold','Gross profit','Expenses','Stock loss','Own use','Stock gains','Net profit'],...rows,['TOTAL',...tot]]};
 start();
</script></body></html>
